# PR と main への変更で、実際のブラウザを使ったテストを動かす
name: テスト

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチの古い実行は止めて、最新だけ確認する
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium（パソコン・Android想定）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --project=android-chrome

  webkit:
    name: WebKit（Safari・iPhone想定）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # WebKit のテストはこれまで一度も実行できていない。結果を確かめて安定するまでは、失敗しても PR を止めない
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=webkit --project=iphone-webkit
